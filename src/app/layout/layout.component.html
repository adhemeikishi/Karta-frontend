<div class="min-h-screen flex bg-slate-50">
  <!-- Sidebar -->
  <aside class="w-60 shrink-0 bg-white border-r border-slate-200 flex flex-col">
    <div class="h-16 flex items-center px-6 border-b border-slate-200">
      <span class="font-semibold text-slate-900">QR Menu Admin</span>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-slate-900 text-white"
        class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        Dashboard
      </a>
      <a
        routerLink="/admin/restaurants"
        routerLinkActive="bg-slate-900 text-white"
        class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        Restaurants
      </a>
    </nav>

    <div class="p-3 border-t border-slate-200">
      <button
        (click)="logout()"
        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-100"
      >
        Se déconnecter
      </button>
    </div>
  </aside>

  <!-- Content -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center px-8">
      <span class="text-sm text-slate-500">Back-office interne — QR Menu</span>
    </header>

    <main class="flex-1 p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
