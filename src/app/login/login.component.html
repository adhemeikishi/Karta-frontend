<div class="grid min-h-[100dvh] lg:grid-cols-[1.1fr_1fr]">
  <!-- Panneau identité -->
  <aside class="relative hidden flex-col justify-between overflow-hidden p-10 lg:flex" style="background-color: var(--k-charcoal)">
    <div class="k-crosshair absolute inset-0 opacity-[0.06]" aria-hidden="true"></div>
    <!-- Panneau identité sur fond sombre (--k-charcoal) → tuile claire. -->
    <div class="relative">
      <karta-logo variant="light" [size]="32" />
    </div>

    <div class="relative">
      <p class="eyebrow" style="color: var(--k-charcoal-muted)">Restaurant-tech</p>
      <p class="mt-3 text-3xl font-bold leading-tight tracking-[-0.02em] text-white">
        Moins de files.<br />Plus de commandes.
      </p>
      <div class="k-ticks mt-6 max-w-[220px]"></div>
    </div>

    <p class="k-coord relative" style="color: var(--k-charcoal-muted)">Back-office · v1</p>
  </aside>

  <!-- Formulaire -->
  <main class="flex items-center justify-center bg-canvas px-4 py-10">
    <div class="w-full max-w-sm">
      <!-- Bandeau mobile sur bg-canvas (fond clair) → tuile sombre. -->
      <div class="mb-6 lg:hidden">
        <karta-logo variant="dark" [size]="36" />
      </div>

      <h1 class="page-title">Connexion</h1>
      <p class="page-subtitle">Accédez au back-office Karta.</p>

      <form (ngSubmit)="submit()" class="mt-6 space-y-4">
        <div>
          <label class="field-label" for="username">Nom d'utilisateur</label>
          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            autocomplete="username"
            class="input"
          />
        </div>

        <div>
          <label class="field-label" for="password">Mot de passe</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            class="input"
          />
        </div>

        @if (errorMessage()) {
          <p class="alert-error">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="loading()" class="btn btn-primary w-full">
          {{ loading() ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>
    </div>
  </main>
</div>
