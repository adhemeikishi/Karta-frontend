<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-xl font-semibold text-slate-900 mb-1">QR Menu Admin</h1>
    <p class="text-sm text-slate-500 mb-6">Connectez-vous pour accéder au back-office.</p>

    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="username">Nom d'utilisateur</label>
        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          autocomplete="username"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"
        />
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-red-600">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-slate-900 text-white text-sm font-medium rounded-lg py-2 hover:bg-slate-800 disabled:opacity-50"
      >
        {{ loading() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
