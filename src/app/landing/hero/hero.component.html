<!-- ═══════════════════════════════════════════════════════════════════════════
     Hero landing Karta — direction unique.
     Typographie capitale sur fond charcoal topographique. Éditorial / cartographique.
     « L'interface. / Reste. » puis décrochage « Le menu. / Évolue. ». « Évolue. »
     change de voix : serif éditorial italique + persimmon (.hero-caps-editorial),
     signature typographique — pas un effet. CTA : /login + #kartaai.
     Fond : photo (hero-photo.webp) + voile de lisibilité (scrim) + vignette + fondu
     progressif vers la section claire suivante (::after de .hero-panel-dark).
     Aucune animation au repos.
     La navbar s'inverse via LandingChromeService tant que ce hero est monté.
     Entrée : .hero-in (au montage, pas au scroll).
     ═══════════════════════════════════════════════════════════════════════════ -->

<!-- -mt-16 : la navbar (sticky) réserve 64px de flux en haut ; on remonte le
     panneau sous elle pour que le charcoal parte du bord (sinon bande claire). -->
<section class="hero-panel-dark relative isolate -mt-16 overflow-hidden">
  <div class="hero-d-photo" aria-hidden="true"></div>
  <div class="hero-d-scrim" aria-hidden="true"></div>
  <div class="hero-d-vignette" aria-hidden="true"></div>

  <div class="relative z-[2] mx-auto max-w-6xl px-4 pb-24 pt-28 sm:px-6 sm:pb-32 sm:pt-36">
    <p class="hero-in mono text-xs tracking-[0.14em]" style="color: var(--k-charcoal-muted)">karta ·</p>

    <h1 class="mt-7 sm:mt-9">
      <span class="hero-in hero-caps block" style="animation-delay: 40ms; color: var(--k-ivory)">L'interface<span class="hero-dot">.</span></span>
      <span class="hero-in hero-caps block" style="animation-delay: 90ms; color: var(--k-ivory)">reste<span class="hero-dot">.</span></span>
      <span class="hero-in hero-caps mt-4 block pl-[11vw] sm:mt-5 sm:pl-[15vw]" style="animation-delay: 160ms; color: var(--k-ivory)">Le menu<span class="hero-dot">.</span></span>
      <span class="hero-in hero-caps hero-caps-editorial mt-2 block pl-[11vw] sm:pl-[15vw]" style="animation-delay: 210ms">évolue<span class="hero-dot">.</span></span>
    </h1>

    <div
      class="hero-in mt-14 flex flex-col gap-6 sm:mt-16 sm:flex-row sm:items-end sm:justify-between"
      style="animation-delay: 300ms"
    >
      <p class="max-w-xs text-base leading-relaxed" style="color: var(--k-charcoal-muted)">
        Réimprimer sa carte à chaque changement de prix, c'est fini.
      </p>
      <div class="flex flex-wrap items-center gap-3">
        <a routerLink="/login" class="btn btn-primary">Créer mon menu</a>
        <a href="#kartaai" (click)="scrollToAnchor('kartaai', $event)" class="btn btn-ghost">
          Voir comment ça marche
        </a>
      </div>
    </div>

    <div class="hero-in hero-d-rule mt-14" style="animation-delay: 380ms" aria-hidden="true"></div>
  </div>
</section>
