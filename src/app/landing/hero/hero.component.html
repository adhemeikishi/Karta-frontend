<!-- ═══════════════════════════════════════════════════════════════════════════
     Hero landing Karta — direction unique.
     Typographie capitale sur fond charcoal topographique. Éditorial / cartographique.
     « Votre carte / Changez-la / Pas le QR », trois lignes en escalier (indentation
     croissante à chaque ligne) et tout en ivoire uniforme — pas d'accent couleur, pas
     de changement de voix typographique (`.hero-caps-editorial` n'est plus utilisé sur
     ce titre — ne pas le réintroduire). Titre définitif, AUCUN point final (ni ici, ni
     via `.hero-dot` : ce span n'est plus utilisé sur ce titre — ne pas le réintroduire).
     Positionnement : ce qui bouge (la carte) avant ce qui ne bouge pas (le QR), jamais
     la technologie (QR / IA) présentée en premier. CTA : /login (« Importer mon menu »)
     + #menu (chapitre 01).
     Fond : photo (hero-photo.webp) + voile de lisibilité (scrim) + vignette + fondu
     progressif vers la section claire suivante (::after de .hero-panel-dark).
     Aucune animation au repos.
     La navbar s'inverse via LandingChromeService tant que ce hero est monté.
     Entrée : .hero-in (au montage, pas au scroll).

     Le sur-titre « karta · » a été retiré : le logo est à 100 px au-dessus, la
     mention n'ajoutait rien et repoussait le titre vers le bas d'une page déjà
     lourde du bas.
     ═══════════════════════════════════════════════════════════════════════════ -->

<!-- -mt-16 : la navbar (sticky) réserve 64px de flux en haut ; on remonte le
     panneau sous elle pour que le charcoal parte du bord (sinon bande claire). -->
<section class="hero-panel-dark relative isolate -mt-16 overflow-hidden">
  <div class="hero-d-photo" aria-hidden="true"></div>
  <div class="hero-d-scrim" aria-hidden="true"></div>
  <div class="hero-d-vignette" aria-hidden="true"></div>

  <div class="relative z-[2] mx-auto max-w-6xl px-4 pb-36 pt-56 sm:px-6 sm:pb-40 sm:pt-64">
    <h1>
      <span class="hero-in hero-caps block" style="color: var(--k-ivory)">Votre carte</span>
      <span class="hero-in hero-caps mt-4 block pl-[6vw] sm:mt-5 sm:pl-[8vw]" style="animation-delay: 60ms; color: var(--k-ivory)">Changez-la</span>
      <span class="hero-in hero-caps mt-2 block pl-[12vw] sm:pl-[16vw]" style="animation-delay: 130ms; color: var(--k-ivory)">Pas le QR</span>
    </h1>

    <!-- Phrase et actions dans une même colonne, bornée à gauche : réparties sur
         toute la largeur, les boutons atterrissaient sur la carte QR de la photo
         et se détachaient de la phrase qui les motive. -->
    <div
      class="hero-in mt-12 max-w-[34rem] sm:mt-14"
      style="animation-delay: 260ms"
    >
      <p class="text-base leading-relaxed sm:text-[1.0625rem]" style="color: var(--k-charcoal-muted)">
        Un menu digital toujours accessible à vos clients. Vous modifiez les plats et
        les prix, jamais le QR.
      </p>
      <div class="mt-7 flex flex-col gap-3 sm:flex-row sm:items-center">
        <a routerLink="/login" class="btn btn-primary">Importer mon menu</a>
        <a href="#menu" (click)="scrollToAnchor('menu', $event)" class="btn btn-ghost">
          Voir comment ça marche
        </a>
      </div>
    </div>

    <div class="hero-in hero-d-rule mt-16" style="animation-delay: 340ms" aria-hidden="true"></div>
  </div>
</section>
