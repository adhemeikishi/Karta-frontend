<!-- Même fond que le CTA final (bg-charcoal, pas de bordure entre les deux) : la
     page se referme sur une seule bande sombre, pas un bloc supplémentaire. -->
<footer class="bg-charcoal">
  <div class="container py-12 sm:py-14">
    <div class="grid grid-cols-1 gap-10 sm:grid-cols-[1.3fr_1fr_1fr]">
      <div>
        <!-- Footer sur bg-charcoal (fond sombre) → tuile claire. -->
        <karta-logo variant="light" [size]="28" />
        <p class="mt-4 max-w-[22rem] text-sm on-dark-muted">
          Votre carte, sans les contraintes : un QR permanent, un menu toujours à
          jour, une identité qui vous appartient.
        </p>
        <p class="k-coord mt-6 on-dark-muted">Karta · v1</p>
      </div>

      <div>
        <p class="eyebrow on-dark-muted">Produit</p>
        <nav class="mt-4 flex flex-col gap-3 text-sm" aria-label="Produit">
          <a routerLink="/features" class="text-white/80 transition-colors duration-150 ease-karta hover:text-white">
            Fonctionnalités
          </a>
          <a routerLink="/pricing" class="text-white/80 transition-colors duration-150 ease-karta hover:text-white">
            Tarifs
          </a>
          <a routerLink="/faq" class="text-white/80 transition-colors duration-150 ease-karta hover:text-white">
            FAQ
          </a>
          <a routerLink="/contact" class="text-white/80 transition-colors duration-150 ease-karta hover:text-white">
            Contact
          </a>
        </nav>
      </div>

      <div>
        <p class="eyebrow on-dark-muted">Compte</p>
        <nav class="mt-4 flex flex-col gap-3 text-sm" aria-label="Compte">
          <a routerLink="/login" class="text-white/80 transition-colors duration-150 ease-karta hover:text-white">
            Se connecter
          </a>
          <a routerLink="/login" class="text-white/80 transition-colors duration-150 ease-karta hover:text-white">
            Créer mon menu
          </a>
        </nav>
      </div>
    </div>

    <p class="k-coord mt-10 border-t pt-6 on-dark-muted" style="border-color: var(--k-charcoal-line)">
      © {{ year }} Karta. Une carte qui reste à jour.
    </p>
  </div>
</footer>
